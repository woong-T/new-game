let seed;
function rng() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// A second generator for decoration only (stars, rock outlines), so looks never shift gameplay.
let dseed = 777;
function drng() {
  dseed = (dseed + 0x6D2B79F5) | 0;
  let t = Math.imul(dseed ^ (dseed >>> 15), dseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------

const ctx = canvas.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);

  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {

// ---- Audio ------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();

    out.connect(ac.destination); audio = { ac, out };

}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}

// ---- Formulas ---------------------------------------------------------------------------
const mobHp = s => tune.mobHpBase * Math.pow(tune.mobHpGrowth, s - 1);
const mobGold = s => tune.goldBase * Math.pow(tune.goldGrowth, s - 1);
const xpNeed = lv => tune.xpBase + tune.xpQuad * lv * lv;
const isBossStage = s => s % 5 === 0;
function bossInfo(s) {
  if (BOSSES[s]) return BOSSES[s];
  const keys = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
  const b = BOSSES[keys[((s / 5) - 1) % keys.length]];
  return { ...b, name: b.name + ' +', joins: null };
}
function bossMult(s) {
  if (s % 50 === 0) return tune.finalHpMult;
  return s % 10 === 0 ? tune.bossHpMult : tune.minibossHpMult;
}
function costAtk() { return tune.atkCostBase * Math.pow(tune.atkCostGrowth, state.up.atk); }
function costSpd() { return tune.spdCostBase * Math.pow(tune.spdCostGrowth, state.up.spd); }
function costCrit() { return tune.critCostBase * Math.pow(tune.critCostGrowth, state.up.crit); }
function costSummon() { return tune.summonBase * Math.pow(tune.summonGrowth, state.summons); }
function curJob() { const j = state.job1; return j ? (state.job2 ? JOBS[j].next : j) : null; }
function heroEl() { return state.job1 ? JOBS[state.job1].el : null; }
const line = id => state.job1 === id; // the 1st job's line (its 2nd job keeps its special)
function baseAtk() {
  return tune.heroBaseAtk * Math.pow(tune.atkGrowth, state.up.atk)
    * Math.pow(tune.atkMilestoneMult, Math.floor(state.up.atk / tune.atkMilestone))
    * Math.pow(tune.levelAtkGrowth, state.level - 1);
}
function synergyCount() { const e = heroEl(); return e ? state.party.filter(id => COMPS[id].el === e).length : 0; }
function synergy() { return 1 + tune.synergyPer * synergyCount(); }
function heroAtk() {
  let m = 1;
  if (state.job1) m *= tune.job1Mult;
  if (state.job2) m *= tune.job2Mult;
  if (state.job2 && line('crystal')) m *= tune.diamondAtk;
  return baseAtk() * m * synergy();
}
function heroSpd() { return tune.heroBaseSpd * (1 + tune.spdPerLv * state.up.spd) * (line('tide') ? tune.tideSpd : 1); }
function critChance() {
  return Math.min(0.95, tune.critPerLv * state.up.crit + (line('starbow') ? tune.starCrit : 0)
    + (line('meteor') && state.job2 ? tune.destroyerCrit : 0));
}
function critDmg() { return tune.critMult + (line('meteor') ? tune.meteorCritDmg : 0); }
function compHit(id) {
  const st = state.comps[id].star;
  return baseAtk() * COMPS[id].share * tune.compShare * (1 + tune.starStep * (st - 1)) * synergy()
    * (line('gravity') && state.job2 ? 1 + tune.blackholeComp : 1);
}
function heroDps() {
  let d = heroAtk() * heroSpd() * (1 + critChance() * (critDmg() - 1));
  if (line('tide') && state.job2) d *= 1 + (tune.tsunamiMult - 1) / tune.tsunamiEvery;
  return d;
}
function compDps() { return state.party.reduce((a, id) => a + compHit(id) / tune.compInterval, 0); }
function totalDps() { return heroDps() + compDps(); }

function fmt(n) {
  n = Math.floor(n);
  if (!isFinite(n)) return '∞';
  if (n < 1e4) return n.toLocaleString('en-US');
  const units = [[1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
  for (const [u, nm] of units) {
    if (n >= u) {
      const v = n / u;
      if (v >= 1e4) return n.toExponential(2).replace('+', '');
      return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString()) + nm;
    }
  }
  return String(n);
}
function fmtTime(s) {
  s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${ss}초` : `${ss}초`;
}

// ---- State ------------------------------------------------------------------------------
let scene, state;

}

function saveGame() {
  try {
    const s = state;

      v: 1, savedAt: Date.now(), stage: s.stage, farming: s.farming, gold: s.gold, xp: s.xp, level: s.level,
      up: s.up, job1: s.job1, job2: s.job2, party: s.party, summons: s.summons, won: s.won, playTime: s.playTime,
      comps: Object.fromEntries(COMP_IDS.map(id => [id, { owned: s.comps[id].owned, star: s.comps[id].star }])),
      dps: totalDps(),

  } catch (e) { /* storage blocked: play on without saving */ }
}
function readSave() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function loadGame(d) {
  reset();
  const s = state;
  Object.assign(s, { stage: d.stage, farming: d.farming, gold: d.gold, dispGold: d.gold, xp: d.xp, level: d.level,
    up: d.up, job1: d.job1, job2: d.job2, party: d.party, summons: d.summons, won: d.won, playTime: d.playTime || 0 });
  for (const id of COMP_IDS) if (d.comps[id]) Object.assign(s.comps[id], d.comps[id]);
  if (isBossStage(s.stage) && !s.farming) startBoss();
  // Away earnings: the real clock is read once, here, to know how long the game was closed.
  const away = Math.min(tune.offlineCapHours * 3600, Math.max(0, (Date.now() - d.savedAt) / 1000));
  if (away >= 60) {
    const st = s.farming || isBossStage(s.stage) ? Math.max(1, s.stage - 1) : s.stage;
    const killRate = Math.min(totalDps() / mobHp(st), 1 / (tune.spawnGap + 0.4));
    const gain = killRate * mobGold(st) * away * tune.offlineRate;
    s.gold += gain; s.dispGold = s.gold;
    s.modals.push({ type: 'away', away, gain, t: 0 });
  }

}

// ---- Effects --------------------------------------------------------------------------
function float(x, y, str, color, size = 20) { state.floats.push({ x, y, str, color, size, t: 0, life: 0.9 }); if (state.floats.length > 40) state.floats.shift(); }

  }

}

// ---- Combat -----------------------------------------------------------------------------
function makeMob(kind, s, opts = {}) {
  const hp = mobHp(s) * MOB_KINDS[kind].hp * (opts.child ? tune.splitFrac / MOB_KINDS[kind].hp : 1);
  const shape = []; for (let i = 0; i < 9; i++) shape.push(0.78 + drng() * 0.34);
  return {
    id: state.nextId++, kind, el: opts.el || EL_KEYS[Math.floor(rng() * 3)], hp, max: hp,
    shield: kind === 'shield' ? hp * tune.shieldFrac : 0, shieldMax: kind === 'shield' ? hp * tune.shieldFrac : 0,
    x: opts.x ?? 1330, y: GROUND + (opts.dy ?? Math.round((rng() - 0.5) * 18)), child: !!opts.child,
    gold: mobGold(s) * MOB_KINDS[kind].gold * (opts.child ? 0.3 : 1), arrived: false, atkCd: 0.8, charged: false,
    flash: 0, shape, phase: rng() * 6,

}

  const s = state.stage, b = bossInfo(s);

  state.mobs = [];
  state.mobs.push({ id: state.nextId++, boss: true, kind: b.kind, name: b.name, el: b.el, tint: b.tint, joins: b.joins,
    hp, max: hp, shield: 0, shieldMax: 0, x: 1400, y: GROUND - 70, gold: mobGold(s) * tune.bossGoldMult,
    arrived: false, atkCd: 2, flash: 0, shape, phase: 0, mini: s % 10 !== 0 });
  state.boss = { timer: tune.bossTime, max: tune.bossTime };
  banner(s % 50 === 0 ? `최종 보스: ${b.name}` : (s % 10 === 0 ? `보스: ${b.name}` : `중간 보스: ${b.name}`), '#ff6b6b', `${tune.bossTime}초 안에 쓰러뜨리세요`);
  sfx.boss();
}
function frontMobs() { return state.mobs.filter(m => m.hp > 0 && m.x < 1250).sort((a, b) => a.x - b.x); }
function applyStun(d) {
  if (line('crystal')) return;
  if (line('starbow')) d *= tune.starStunCut;
  if (d > state.heroStun) { state.heroStun = d; float(HERO_X + 40, GROUND - 140, '기절', '#fff3b0', 16); sfx.stun(); }
}
function damage(m, dmg, opts = {}) {
  if (m.hp <= 0) return;
  if (m.shield > 0 && !opts.pierce) {

function heroAttack() {
  const ms = frontMobs(); if (!ms.length) return;

    const em = elMod(el, tg.el); d *= em;

    damage(tg, d, { show: true, crit, strong: em > 1, weak: em < 1, pierce: line('crystal') });

function simulate(dt) {
  const s = state;
  s.t += dt; s.playTime += dt;
  s.dispGold = s.gold < s.dispGold ? s.gold : s.dispGold + (s.gold - s.dispGold) * Math.min(1, dt * 7);
  // hero
  s.heroAnim = Math.max(0, s.heroAnim - dt);
  if (s.heroStun > 0) s.heroStun -= dt;
  else {
    s.heroCd -= dt;
    if (s.heroCd <= 0) {
      if (frontMobs().length) { heroAttack(); s.heroCd += 1 / heroSpd(); }
      else s.heroCd = 0;
    }
  }
  // companions
  s.party.forEach((id, i) => {
    const c = s.comps[id]; c.cd -= dt;
    if (c.cd <= 0) {
      const ms = frontMobs();
      if (ms.length) {
        const [px, py] = SLOTS[i];
        s.projs.push({ x0: px + 14, y0: py - 45, tgt: ms[0].id, t: 0, dur: 0.32, dmg: compHit(id), el: COMPS[id].el, enemy: false });
        c.cd += tune.compInterval * (0.9 + rng() * 0.2);
      } else c.cd = 0.2;
    }
  });
  // projectiles
  for (const p of s.projs) {
    p.t += dt;
    if (p.t >= p.dur && !p.done) {
      p.done = true;
      if (p.enemy) applyStun(tune.pulseStun);
      else {
        const m = s.mobs.find(q => q.id === p.tgt && q.hp > 0) || frontMobs()[0];
        if (m) { let d = p.dmg * elMod(p.el, m.el); damage(m, d, { show: true, strong: elMod(p.el, m.el) > 1 }); }
      }
    }
  }
  s.projs = s.projs.filter(p => !p.done);
  // enemies
  const order = s.mobs.filter(m => m.hp > 0 && !m.boss && m.kind !== 'pulsar').sort((a, b) => a.x - b.x);
  for (const m of s.mobs) {
    if (m.hp <= 0) continue;
    m.flash = Math.max(0, m.flash - dt);
    let stopX;
    if (m.boss) stopX = HERO_X + 300;
    else if (m.kind === 'pulsar') stopX = HERO_X + 430 + (m.id % 3) * 40;
    else stopX = HERO_X + 75 + order.indexOf(m) * 58;
    const sp = m.boss ? 160 : m.kind === 'charger' && !m.charged ? tune.chargerSpeed : tune.walkSpeed;
    if (m.x > stopX + 1) { m.x = Math.max(stopX, m.x - sp * dt); m.arrived = false; }
    else {
      if (!m.arrived) {
        m.arrived = true;
        if (m.kind === 'charger' && !m.charged && !m.boss) { m.charged = true; applyStun(tune.chargeStun); s.shake = 0.15; burst(HERO_X + 30, GROUND - 30, '#ffb347', 6, 100); }
      }
      m.atkCd -= dt;
      if (m.atkCd <= 0) {
        if (m.boss) {
          m.atkCd = tune.bossInterval; applyStun(tune.bossStun); s.shake = 0.25;
          s.fx.push({ type: 'wave', x: m.x, y: GROUND - 30, t: 0, life: 0.5 });
        } else if (m.kind === 'pulsar') {
          m.atkCd = tune.pulseInterval;
          s.projs.push({ x0: m.x - 10, y0: m.y - 50, x1: HERO_X + 10, y1: GROUND - 45, t: 0, dur: 0.5, enemy: true, el: m.el });
        } else if (order.indexOf(m) === 0) { m.atkCd = tune.meleeInterval; applyStun(tune.meleeStun); m.lunge = 0.15; }
        else m.atkCd = 0.5;
      }
      if (m.lunge) m.lunge = Math.max(0, m.lunge - dt);
    }
  }
  s.mobs = s.mobs.filter(m => m.hp > 0);
  // stage flow
  if (s.boss) {
    s.boss.timer -= dt;
    if (s.boss.timer <= 0 && s.mobs.some(m => m.boss)) {
      s.mobs = []; s.boss = null; s.stage = Math.max(1, s.stage - 1); s.farming = true; s.kills = 0; s.spawned = 0; s.spawnCd = 1;
      banner('후퇴!', '#ff8a8a', '강화하거나 전직한 뒤 [보스 도전]으로 다시 맞서세요');
      sfx.retreat(); events.push({ type: 'retreat' }); saveGame();
    }
  } else {
    if (s.kills >= tune.killsPerStage && !s.mobs.some(m => !m.child)) {
      s.kills = 0; s.spawned = 0; s.spawnCd = 0.8;
      if (!s.farming) {
        s.stage++; s.mobs = s.mobs.filter(m => m.child);
        if (isBossStage(s.stage)) startBoss(); else banner(`스테이지 ${s.stage}`, '#ffffff');
      }
    }
    s.spawnCd -= dt;
    const alive = s.mobs.filter(m => !m.child).length;
    if (!s.boss && s.spawnCd <= 0 && alive < tune.maxMobs && s.spawned < tune.killsPerStage) {
      const pool = ['charger'];
      if (s.stage >= 3) pool.push('shield');
      if (s.stage >= 6) pool.push('slime');
      if (s.stage >= 8) pool.push('pulsar');
      s.mobs.push(makeMob(pool[Math.floor(rng() * pool.length)], s.stage));
      s.spawned++; s.spawnCd = tune.spawnGap;
    }
  }

  for (const f of s.fx) f.t += dt; s.fx = s.fx.filter(f => f.t < f.life);
  for (const p of s.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; } s.parts = s.parts.filter(p => p.t < p.life);
  for (const f of s.floats) { f.t += dt; f.y -= 50 * dt; } s.floats = s.floats.filter(f => f.t < f.life);
  s.shake = Math.max(0, s.shake - dt);
  s.saveCd -= dt; if (s.saveCd <= 0) { s.saveCd = 5; saveGame(); }
}

// ---- Actions ----------------------------------------------------------------------------
function buy(kind) {
  const s = state;
  if (kind === 'spd' && s.up.spd >= tune.spdMaxLv) return sfx.no();
  if (kind === 'crit' && s.up.crit >= tune.critMaxLv) return sfx.no();
  const cost = kind === 'atk' ? costAtk() : kind === 'spd' ? costSpd() : costCrit();
  if (s.gold < cost) return sfx.no();
  s.gold -= cost; s.up[kind]++;
  if (kind === 'atk' && s.up.atk % tune.atkMilestone === 0) {
    sfx.milestone(); burst(HERO_X, GROUND - 50, '#ffcf4a', 30, 220);
    banner(`공격력 Lv ${s.up.atk} 달성!`, '#ffcf4a', `공격력 ×${tune.atkMilestoneMult}`);
  } else sfx.buy();

}
function summon() {
  const cost = costSummon();

  state.gold -= cost; state.summons++;
  const total = COMP_IDS.reduce((a, id) => a + COMPS[id].w, 0);
  let r = rng() * total, pick = COMP_IDS[0];
  for (const id of COMP_IDS) { r -= COMPS[id].w; if (r <= 0) { pick = id; break; } }

}

}

  startBoss();
}

let ui = [];

        text(`[${idx + 1}]`, bx + 240, by + 160, 13, '#7a74a8');
      });
    });
  } else if (m.type === 'job2') {
    const j1 = JOBS[state.job1], j2 = JOBS[j1.next], e = EL[j1.el];
    const { x, y } = modalFrame(760, 440, '#ffe58a');
    text('2차 전직이 열렸습니다!', 640, y + 40, 28, '#ffe58a', 'center', 'bold');
    drawHero(x + 190, y + 300, 1.8, state.job1, t); drawHero(x + 560, y + 300, 1.8, j1.next, t);
    ctx.fillStyle = e.c; ctx.beginPath(); ctx.moveTo(x + 350, y + 200); ctx.lineTo(x + 400, y + 225); ctx.lineTo(x + 350, y + 250); ctx.closePath(); ctx.fill();
    text(j1.name, x + 190, y + 330, 18, '#c8bfff', 'center', 'bold'); text(j2.name, x + 560, y + 330, 22, e.c, 'center', 'bold');
    text(j2.desc, 640, y + 362, 16, '#e0dcff');
    okButton(640, y + 404, '전직하기 [Enter]', chooseJob2, 240);
  } else if (m.type === 'reveal') {
    const c = COMPS[m.id], e = EL[c.el];
    modalFrame(560, 420, e.c);
    const cx = 640, cy = 300;
    if (m.t < 1.3) {
      const wob = Math.sin(m.t * 18) * 0.25 * (m.t < 1 ? 1 : 0);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(wob);
      const r = 40 + m.t * 10;
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, r * 1.6); g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(197,140,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2); ctx.fill();
      sparkle(0, 0, r, '#ffd86b'); ctx.rotate(Math.PI / 4); sparkle(0, 0, r * 0.6, '#ffffff');
      ctx.restore();
      text(m.source === 'boss' ? '정화된 천체가 다가온다...' : '별이 모인다...', 640, 210, 18, '#e0dcff');
    } else {
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + t; sparkle(cx + Math.cos(a) * 120, cy - 30 + Math.sin(a) * 70, 5, e.c); }
      drawComp(m.id, cx, cy + 70, 3, t);
      text(m.isNew ? '새 동료!' : m.refund ? '별 최대: 별가루 일부 반환' : `별 ${m.star} 승급!`, 640, 190, 22, m.isNew ? '#ffe58a' : '#9fffb0', 'center', 'bold');
      text(`${c.name} · ${c.planet}`, 640, 400, 26, '#ffffff', 'center', 'bold');
      text(`${e.name} 속성`, 640, 432, 16, e.c);
      for (let k = 0; k < 5; k++) sparkle(600 + k * 20, 460, 7, k < m.star ? '#ffd86b' : 'rgba(255,255,255,0.15)');
      okButton(640, 488, '확인 [Enter]', closeModal);
    }
  } else if (m.type === 'away') {
    const { y } = modalFrame(560, 260, '#ffe58a');
    text('다시 오셨군요!', 640, y + 50, 28, '#ffe58a', 'center', 'bold');
    text(`자리를 비운 ${fmtTime(m.away)} 동안 동료들이 싸웠습니다`, 640, y + 100, 17, '#e0dcff');
    sparkle(560, y + 145, 12, '#ffe58a'); text(`+${fmt(m.gain)} 별가루`, 580, y + 145, 26, '#ffe58a', 'left', 'bold');
    okButton(640, y + 212, '받기 [Enter]', closeModal);
  } else if (m.type === 'tree') {
    const { x, y } = modalFrame(1100, 520);
    text('전직 트리', 640, y + 34, 26, '#ffffff', 'center', 'bold');
    text(`Lv ${tune.job1Level}: 1차 전직   ·   Lv ${tune.job2Level}: 2차 전직`, 640, y + 66, 15, '#c8bfff');
    EL_KEYS.forEach((ek, col) => {
      const e = EL[ek], cx = x + 40 + col * 350;
      text(e.name, cx + 150, y + 104, 20, e.c, 'center', 'bold');
      JOB1.filter(j => JOBS[j].el === ek).forEach((jid, r) => {
        const by = y + 130 + r * 180, mine = state.job1 === jid;
        rr(cx, by, 310, 166, 12); ctx.fillStyle = mine ? '#2c1f6a' : '#140e36'; ctx.fill(); ctx.strokeStyle = mine ? e.c : 'rgba(197,140,255,0.3)'; ctx.lineWidth = mine ? 3 : 1; ctx.stroke();
        drawHero(cx + 50, by + 120, 0.95, jid, t); drawHero(cx + 200, by + 120, 0.95, JOBS[jid].next, t);
        ctx.fillStyle = e.c; ctx.beginPath(); ctx.moveTo(cx + 112, by + 70); ctx.lineTo(cx + 132, by + 80); ctx.lineTo(cx + 112, by + 90); ctx.closePath(); ctx.fill();
        text(JOBS[jid].name, cx + 60, by + 142, 14, '#ffffff', 'center', 'bold');
        text(JOBS[JOBS[jid].next].name, cx + 220, by + 142, 14, mine && state.job2 ? e.c : '#ffffff', 'center', 'bold');
        text(JOBS[jid].desc, cx + 155, by + 18, 12, '#b8b0e0');
      });
    });
    okButton(640, y + 496, '닫기 [Enter]', closeModal);
  }
}
function wrap(str, x, y, maxW, size, color) {
  ctx.font = `${size}px ${FONT}`;
  const words = str.split(' '); let lineStr = '', ly = y;
  for (const w of words) { const test = lineStr ? lineStr + ' ' + w : w; if (ctx.measureText(test).width > maxW && lineStr) { text(lineStr, x, ly, size, color); lineStr = w; ly += size + 6; } else lineStr = test; }
  if (lineStr) text(lineStr, x, ly, size, color);
}
function closeModal() { const m = state.modals[0]; if (!m) return; if (m.type === 'reveal' && m.t < 1.3) return; if (m.type === 'job1' || m.type === 'job2') return; state.modals.shift(); }

// ---- Scenes -----------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      const t = state.t;
      drawSpace(t, H);
      text('등장 인물 · 적 · 보스 · 동료', 640, 24, 20, '#ffffff', 'center', 'bold');
      const heroes = [null, ...JOB1, 'diamond', 'tsunami', 'galaxy', 'blackhole', 'destroyer', 'nebula'];
      heroes.forEach((j, i) => { const x = 50 + i * 90; drawHero(x, 150, 0.85, j, t); text(j ? JOBS[j].name : '기본 용사', x, 168, 11, '#e0dcff'); });
      const kinds = ['charger', 'shield', 'slime', 'pulsar'];
      kinds.forEach((k, i) => {
        const m = makeMobFigure(k, 90 + i * 150, 290, EL_KEYS[i % 3]); drawMob(m, t); text(MOB_KINDS[k].name, m.x, 312, 13, '#e0dcff');
      });
      const child = makeMobFigure('slime', 690, 290, 'astral'); child.child = true; drawMob(child, t); text('분열한 슬라임', 690, 312, 13, '#e0dcff');
      const bk = [[5, 'rock'], [10, 'star'], [15, 'comet'], [20, 'gas'], [30, 'ring'], [50, 'bigbang']];
      bk.forEach(([st, k], i) => {
        const b = BOSSES[st], x = 120 + i * 205;
        const shape = []; for (let q = 0; q < 14; q++) shape.push(0.82 + ((q * 37) % 11) / 36);
        ctx.save(); ctx.translate(x, 430); ctx.scale(0.5, 0.5);
        drawBoss({ ...b, x: 0, y: 0, shape, flash: 0, mini: false }, t); ctx.restore();
        text(b.name, x, 500, 13, '#e0dcff');
      });
      COMP_IDS.forEach((id, i) => { const x = 90 + i * 150; drawComp(id, x, 640, 1.5, t); text(`${COMPS[id].name} (${COMPS[id].planet})`, x, 666, 13, '#e0dcff'); });
    },
  },
  title: {
    update() {
      const save = readSave();
      const go = () => { if (save) loadGame(save); else reset(); scene = 'play'; };
      if (pressed('Enter') || pressed('Space')) go();
      else if (pressed('KeyN')) { clearSave(); reset(); scene = 'play'; }
      else if (clicks.length) { const c = clicks.shift(); clicks.length = 0; if (save && c.y > 600 && c.x > 700) { clearSave(); reset(); scene = 'play'; } else go(); }
    },
    draw() {
      const t = clock.now();
      drawSpace(t, H);
      drawHero(560, 380, 2.2, null, t);
      ['luna', 'sol', 'saturn', 'comet'].forEach((id, i) => drawComp(id, 700 + i * 90, 370 + (i % 2) * 20, 1.4, t));
      ctx.strokeStyle = 'rgba(10,5,30,0.9)'; ctx.lineWidth = 8; ctx.font = `bold 72px ${FONT}`; ctx.textAlign = 'center'; ctx.strokeText(TITLE, W / 2, 150);
      text(TITLE, W / 2, 150, 72, '#ffe58a', 'center', 'bold');
      text('기본 용사에서 우주의 수호자로 — 행성 동료들과 함께 빅뱅까지', W / 2, 212, 20, '#e0dcff');
      CONTROLS.forEach((c, i) => text(c, W / 2, 470 + i * 34, 18, '#c8bfff'));
      const save = readSave();
      const blink = 0.6 + 0.4 * Math.sin(t * 4);
      ctx.globalAlpha = blink; text(save ? 'Enter 또는 클릭: 이어하기' : 'Enter 또는 클릭: 시작', W / 2, 640, 26, '#ffffff', 'center', 'bold'); ctx.globalAlpha = 1;
      if (save) text('N 또는 오른쪽 아래 클릭: 새로 시작', 1100, 690, 14, '#8f88b8');
    },
  },
  play: {
    update(dt) {
      const s = state;
      if (pressed('KeyP') || pressed('Escape')) { if (s.modals[0] && s.modals[0].type === 'tree') { s.modals.shift(); return; } scene = 'pause'; return; }
      handleClicks();
      if (s.banners[0]) { s.banners[0].t += dt; if (s.banners[0].t > s.banners[0].life) s.banners.shift(); }
      const m = s.modals[0];
      if (m) {
        m.t += dt;
        if (m.type === 'reveal' && m.t >= 1.3 && !m.jingled) { m.jingled = true; sfx.jingle(); burst(640, 300, EL[COMPS[m.id].el].c, 40, 300); }
        if (m.type === 'reveal' && m.t < 1.3 && Math.floor(m.t / 0.33) !== Math.floor((m.t - dt) / 0.33)) sfx.wobble();
        if (m.type === 'job1') { JOB1.forEach((j, i) => { if (pressed('Digit' + (i + 1))) chooseJob1(j); }); }
        else if (m.type === 'job2') { if (pressed('Enter') || pressed('Space')) chooseJob2(); }
        else if (pressed('Enter') || pressed('Space') || pressed('KeyJ') && m.type === 'tree') closeModal();
        // particles keep moving behind a modal; the fight waits
        for (const p of s.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; } s.parts = s.parts.filter(p => p.t < p.life);
        s.t += dt;
        return;
      }
      if (pressed('Digit1')) buy('atk');
      if (pressed('Digit2')) buy('spd');
      if (pressed('Digit3')) buy('crit');
      if (pressed('KeyS')) summon();
      if (pressed('KeyB')) challengeBoss();
      if (pressed('KeyJ')) s.modals.push({ type: 'tree', t: 0 });
      simulate(dt);
    },
    draw() {
      ui = [];
      drawBattle(); drawHUD(); drawPanel();
      if (state.modals[0]) drawModal(state.modals[0]);
    },
  },
  pause: {
    update() { clicks.length = 0; if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) scene = 'play'; },
    draw() {
      scenes.play.draw(); ui = [];
      ctx.fillStyle = 'rgba(4,2,14,0.6)'; ctx.fillRect(0, 0, W, H);
      text('일시정지', W / 2, H / 2 - 20, 48, '#ffffff', 'center', 'bold');
      text('P: 계속하기', W / 2, H / 2 + 34, 22, '#c8bfff');
    },
  },
  results: {
    update() {
      handleClicks();
      if (pressed('Enter')) continueAfterWin();
      if (pressed('KeyR')) restartAll();
    },
    draw() {
      ui = [];
      const t = state.t;
      drawBattle();
      ctx.fillStyle = 'rgba(4,2,14,0.75)'; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2 + clock.now() * 0.3; sparkle(640 + Math.cos(a) * (300 + (i % 3) * 30), 330 + Math.sin(a) * 220, 4 + (i % 4), ['#ffd86b', '#c58cff', '#4fe3e0'][i % 3]); }
      text('빅뱅을 쓰러뜨렸다!', 640, 150, 56, '#ffe58a', 'center', 'bold');
      text(state.gained || '', 640, 210, 20, '#e0dcff');
      const job = curJob();
      drawHero(560, 420, 2.2, job, clock.now());
      state.party.forEach((id, i) => drawComp(id, 680 + i * 80, 410 + (i % 2) * 18, 1.5, clock.now()));
      text(`${job ? JOBS[job].name : '기본 용사'} · Lv ${state.level} · 동료 ${COMP_IDS.filter(id => state.comps[id].owned).length}/${COMP_IDS.length}명`, 640, 470, 20, '#ffffff', 'center', 'bold');
      okButton(520, 560, '계속 키우기 [Enter]', continueAfterWin, 230);
      okButton(780, 560, '처음부터 [R]', restartAll, 200);
    },
  },
};
function continueAfterWin() {
  const s = state; s.stage++; s.kills = 0; s.spawned = 0; s.mobs = []; s.boss = null; s.farming = false; scene = 'play';
  banner(`스테이지 ${s.stage}: 끝없는 우주`, '#ffe58a', '이제부터는 원하는 만큼 키워 보세요'); saveGame();
}
function restartAll() { clearSave(); reset(); scene = 'play'; }
function makeMobFigure(kind, x, y, el) {
  const shape = []; for (let i = 0; i < 9; i++) shape.push(0.8 + ((i * 53) % 13) / 40);
  return { kind, el, x, y, hp: 1, max: 1, shield: kind === 'shield' ? 1 : 0, shieldMax: kind === 'shield' ? 1 : 0, shape, phase: 0, flash: 0, arrived: false, atkCd: 1 };
}

// ---- Loop -------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  if (muted) text('음소거 (M)', W - 12, H - 10, 11, '#8f88b8', 'right');
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && scene === 'play') saveGame(); });
addEventListener('beforeunload', () => { if (scene === 'play' || scene === 'results') saveGame(); });

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
